name: Build releases

# Hand-rolled release pipeline (no third-party actions except the official
# setup/upload ones):
#
#   1. Builds a one-file binary per OS on that OS's own runner —
#        Linux   -> dist/InsomniaLauncher
#        Windows -> dist/InsomniaLauncher.exe
#   2. Attaches BOTH to the GitHub Release for the given tag (default: the
#      latest existing tag), overwriting stale assets.
#
# The app's built-in updater (app/updater.py) downloads exactly the asset that
# contains "InsomniaLauncher" for its own OS, replaces its own binary in place
# and relaunches — so these are precisely the files the "Download now" prompt
# swaps in.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (default: latest tag)"
        required: false
        default: ""
      upload:
        description: "Attach binaries to the release (default: true)"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach binaries to (default: latest tag)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  PYTHON_VER: "3.12"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pyinstaller_command: |
              python -m PyInstaller \
                --clean \
                --onefile \
                --windowed \
                --name InsomniaLauncher \
                --add-data "ui/assets/icon.png:ui/assets" \
                main.py
            artifact: InsomniaLauncher
            path: dist/InsomniaLauncher
            kind: linux
          - os: windows-latest
            pyinstaller_command: |
              python -m PyInstaller ^
                --clean ^
                --onefile ^
                --windowed ^
                --name InsomniaLauncher ^
                --add-data "ui\\assets\\icon.png;ui\\assets" ^
                main.py
            artifact: InsomniaLauncher.exe
            path: dist/InsomniaLauncher.exe
            kind: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: PyInstaller build
        shell: ${{ matrix.kind == 'windows' && 'cmd' || 'bash' }}
        run: |
          ${{ matrix.pyinstaller_command }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  attach:
    name: Attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    if: inputs.upload != false
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: binaries

      - name: Resolve the tag to attach to
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "$tag" ] || [ "$tag" = "main" ] || [ "$tag" = "master" ]; then
            tag="$(gh release list --limit 1 --json tagName -q '.[0].tagName')"
          fi
          echo "resolved_tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish / update release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          tag="${{ steps.tag.outputs.resolved_tag }}"
          echo "Attaching binaries under tag: $tag"

          # Create the release idempotently (fails harmlessly if it exists).
          gh release create "$tag" --title "$tag" --generate-notes >/dev/null 2>&1 || true

          # Upload/overwrite every built binary.
          for f in binaries/*; do
            [ -f "$f" ] || continue
            echo "Uploading $(basename "$f")"
            gh release upload "$tag" "$f" --clobber
          done

          gh release view "$tag" --json name,assets -q '{name:.name, assets:[.assets[].name]}'
