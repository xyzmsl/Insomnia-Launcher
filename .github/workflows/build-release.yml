name: Build releases

# One-file binary per OS, built on that OS's own runner, attached to the
# release for a tag (workflow_dispatch input `tag`, or the ref/tag that pushed
# this file). Both asset names contain "InsomniaLauncher", which is exactly
# what app/updater.py:_asset_match looks for — so the app's own "Download now"
# prompt grabs the right asset for its OSche, self-replaces in place and
# relaunches.
#
# No shell ternary, no &&/|| value tricks: the matrix carries a static
# `shell:` column (bash / cmd) and the build step does a plain
# `${{ matrix.shell }}` named-value fetch — guaranteed parseable.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (default: latest tag)"
        required: false
        default: ""
      upload:
        description: "Attach binaries to the release (default: true)"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach binaries to (default: latest tag)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  PYTHON_VER: "3.12"

jobs:
  build:
    name: Build ${{ matrix.kind }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: linux
            shell: bash
            pyinstaller_runs_as: bash
          - os: windows-latest
            kind: windows
            shell: cmd

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: PyInstaller build
        shell: ${{ matrix.shell }}
        run: |
          cd "${{ github.workspace }}"
          ${{ matrix.kind == 'linux' && 'PYI_LINUX' || 'PYI_WIN' }}
