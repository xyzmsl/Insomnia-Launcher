name: Build releases

# Builds the one-file, self-updating release binaries and attaches them to the
# GitHub release for the tag you point at.
#
#   • Linux  : dist/InsomniaLauncher    (ubuntu-latest)
#   • Windows: dist/InsomniaLauncher.exe (windows-latest)
#
# The built-in auto-updater (app/updater.py) downloads exactly the asset named
# for the current platform (asset name must contain "InsomniaLauncher") and
# replaces itself in place — so packages and windows both just work.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the binaries to (default: latest tag)"
        required: false
        default: ""
      # Make the se name match the updater's expectations on both OSes.
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            script: packaging/build_linux.sh
            asset: dist/InsomniaLauncher
          - name: Windows
            os: windows-latest
            script: packaging/build_windows.bat
            asset: dist/InsomniaLauncher.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build ${{ matrix.name }} binary
        shell: bash
        run: bash "${{ matrix.script }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish${{ matrix.suffix == '' && ' (binary assets)' || '' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: releases/binaries

      - name: Resolve the tag to publish under
        id: tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF_NAME:-$(gh release list --limit 1 --json tagName -q '.[0].tagName')}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create / update the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          echo "Publishing under tag: $tag"
          gh release view "$tag" --json tagName >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes
          while IFS= read -r -d '' f; do
            echo "Uploading $(basename "$f")"
            gh release upload "$tag" "$f" --clobber
          done < <(find releases/binaries -type f -print0)

      - name: Show the release
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh release view "$tag" --json tagName,assets -q '{tag:.tagName, assets:[.assets[].name]}'
